  <div class="dataset-showcase__results"
       data-dataset-showcase
       data-api-endpoint="{{ page.dataset.api_endpoint | escape }}"
       data-catalogue-base-url="https://discovery.psi.ch/datasets/"
       data-singular="{{ page.dataset.singular | escape }}"
       data-plural="{{ page.dataset.plural | escape }}"
       data-availability="{{ page.dataset.availability | escape }}"
       data-card-action="{{ page.dataset.card_action | escape }}"
       data-loading-message="{{ page.dataset.loading_message | escape }}"
       data-empty-message="{{ page.dataset.empty_message | escape }}"
       data-error-message="{{ page.dataset.error_message | escape }}"
       data-error-details-label="{{ page.dataset.error_details_label | escape }}"
       data-retry-action="{{ page.dataset.retry_action | escape }}"
       aria-busy="true">
    <div class="dataset-showcase__summary" aria-label="{{ page.dataset.summary_label }}" hidden>
      <strong data-dataset-count></strong>
      <span data-dataset-summary></span>
    </div>

    <div class="dataset-showcase__status" data-dataset-status role="status">
      {{ page.dataset.loading_message }}
    </div>

    <div class="dataset-grid" data-dataset-grid></div>
  </div>

  <noscript>
    <p class="dataset-showcase__status dataset-showcase__status--error">
      JavaScript is required to load OpenEM datasets from the PSI Data Catalog.
    </p>
  </noscript>

  <script src="{{ '/assets/js/explore/datasets.js' | relative_url }}" defer></script>
